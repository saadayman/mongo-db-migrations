name: Node.js CI/CD

on:
  push:
    branches: [ dev,staging,master ]
  pull_request:
    branches: [ dev,staging,master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Run migrations
      env:
        MONGO_URI: mongodb+srv://sayman:sayman@cluster0.rl0sfdh.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
        DB_NAME: mydb
      run: npm run migrate:up

    - name: Start App
      env:
        MONGO_URI: mongodb+srv://sayman:sayman@cluster0.rl0sfdh.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
        DB_NAME: mydb
      run: npm start
